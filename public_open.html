<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SmartBin-1 | Touchless Public Access</title>
  
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 18px 12px;
      background:
        radial-gradient(circle at 50% 0%, rgba(99,102,241,.28), transparent 38%),
        radial-gradient(circle at 0% 100%, rgba(59,130,246,.12), transparent 35%),
        #070b14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .mobile-wrapper { width: 100%; max-width: 430px; }

    .mobile-card {
      width: 100%;
      padding: 24px 18px 20px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 28px;
      background: rgba(17,24,39,.88);
      box-shadow: 0 24px 70px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .ble-header-icon {
      width: 66px;
      height: 66px;
      margin: 0 auto 14px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      color: #c7d2fe;
      background: linear-gradient(145deg,rgba(96,165,250,.18),rgba(129,140,248,.12));
      border: 1px solid rgba(129,140,248,.24);
      box-shadow: 0 12px 30px rgba(79,70,229,.15);
      transition: .25s ease;
    }

    .ble-header-icon.connected {
      color: #6ee7b7;
      background: rgba(16,185,129,.13);
      border-color: rgba(52,211,153,.3);
      box-shadow: 0 12px 30px rgba(16,185,129,.16);
    }

    .connection-pill {
      min-height: 42px;
      padding: 0 14px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 1px solid rgba(255,255,255,.09);
      background: rgba(255,255,255,.045);
      font-size: .82rem;
      font-weight: 700;
    }

    .pill-connected {
      color: #6ee7b7;
      background: rgba(16,185,129,.09);
      border-color: rgba(52,211,153,.24);
    }

    .pill-disconnected { color: #cbd5e1; }

    .pill-error {
      color: #fca5a5;
      background: rgba(248,113,113,.09);
      border-color: rgba(248,113,113,.24);
    }

    .status-indicator-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #94a3b8;
    }

    .pill-connected .status-indicator-dot {
      background: #34d399;
      box-shadow: 0 0 0 4px rgba(52,211,153,.12), 0 0 12px rgba(52,211,153,.55);
    }

    .action-btn {
      width: 100%;
      min-height: 54px;
      border-radius: 16px !important;
      font-size: .95rem !important;
      font-weight: 800 !important;
      transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
    }

    .action-btn:active { transform: scale(.98); }

    .btn-primary { box-shadow: 0 12px 26px rgba(59,130,246,.2); }
    .btn-success { box-shadow: 0 12px 26px rgba(16,185,129,.18); }

    .btn-disconnect {
      margin-top: 14px;
      min-height: 44px;
      font-size: .82rem !important;
    }

    .timer-ring-container {
      width: 150px !important;
      height: 150px !important;
      margin: 12px auto 18px !important;
      display: grid;
      place-items: center;
      position: relative;
    }

    .timer-countdown {
      font-size: 3.2rem !important;
      font-weight: 900 !important;
      line-height: 1;
      text-shadow: 0 0 24px rgba(52,211,153,.3);
    }
@media (max-width: 420px) {
      body { padding: 10px; justify-content: flex-start; }

      .mobile-card {
        margin-top: 6px;
        padding: 20px 15px 16px;
        border-radius: 24px;
      }
    }
  </style>
</head>
<body>

  <div class="mobile-wrapper">
    <div class="mobile-card">
      
      <!-- Top header with device icon -->
      <div class="ble-header-icon" id="bleStatusIcon">
        <svg id="bluetoothSvg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6.5 6.5 17.5 17.5 12 23 12 1 17.5 6.5 6.5 17.5"/>
        </svg>
      </div>

      <h1 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.35rem;">SmartBin-1</h1>
      <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 1rem;">
        Hands-Free Waste Disposal Access
      </p>

      <!-- Connection Pill Badge -->
      <div id="connectionPill" class="connection-pill pill-disconnected">
        <span class="status-indicator-dot"></span>
        <span id="connectionPillText">Ready to Connect</span>
      </div>

      <!-- Main Action Area -->
      <div id="actionArea" style="margin-top: 1rem;">
        
        <!-- State 1: Connect Button (Visible when disconnected) -->
        <div id="connectState">
          <button id="connectBtn" class="action-btn btn-primary">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2v20M2 12h20"/>
            </svg>
            <span>Connect to SmartBin</span>
          </button>

          <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.75rem;">
            Ensure Bluetooth is turned on and you are within 3 meters of the bin.
          </p>


        </div>

        <!-- State 2: Connected Controls (Hidden initially, shown upon successful connection) -->
        <div id="connectedState" style="display: none;">
          
          <div id="lidReadyView">
            <button id="openLidBtn" class="action-btn btn-success">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
              </svg>
              <span>OPEN LID</span>
            </button>
            <p style="font-size: 0.8rem; color: #34d399; margin-top: 0.75rem; font-weight: 500;">
              ✓ Connected to SmartBin-1 (GATT Server Active)
            </p>
          </div>

          <!-- State 3: Lid Opened / Countdown Animation -->
          <div id="lidOpenView" style="display: none;">
            <div class="timer-ring-container">
              <div class="pulse-circle"></div>
              <div class="timer-countdown" id="countdownSecs">10</div>
            </div>
            <p style="font-size: 1.1rem; font-weight: 700; color: #10b981;">Lid is Open!</p>
            <p style="font-size: 0.8rem; color: var(--text-secondary);">Drop waste now. Auto-closing in seconds...</p>
          </div>

          <!-- Disconnect Button -->
          <button id="disconnectBtn" class="action-btn btn-disconnect">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
            <span>Disconnect</span>
          </button>

        </div>

      </div>

      </div>



    </div>
  </div>

  <script src="js/mock_data.js"></script>
  <script src="js/firebase_config.js"></script>
  <script>
    // Configuration specified in Task 3
    const BLE_CONFIG = {
      deviceName: "SmartBin-1",
      serviceUuid: "12345678-1234-5678-1234-56789abcdef0",
      charLidUuid: "12345678-1234-5678-1234-56789abcdef1"
    };

    // DOM Elements
    const connectState = document.getElementById("connectState");
    const connectedState = document.getElementById("connectedState");
    const lidReadyView = document.getElementById("lidReadyView");
    const lidOpenView = document.getElementById("lidOpenView");
    const countdownSecs = document.getElementById("countdownSecs");
    const connectBtn = document.getElementById("connectBtn");
    const openLidBtn = document.getElementById("openLidBtn");
    const disconnectBtn = document.getElementById("disconnectBtn");
    const connectionPill = document.getElementById("connectionPill");
    const connectionPillText = document.getElementById("connectionPillText");
    const bleStatusIcon = document.getElementById("bleStatusIcon");

    // Bluetooth connection handles
    let bluetoothDevice = null;
    let gattServer = null;
    let lidCharacteristic = null;
    let isSimulated = false;
    let countdownInterval = null;
    function showUserStatus(message, type = "info") {
      connectionPillText.textContent = message;

      if (type === "success") {
        connectionPill.className = "connection-pill pill-connected";
      } else if (type === "error") {
        connectionPill.className = "connection-pill pill-error";
      } else {
        connectionPill.className = "connection-pill pill-disconnected";
      }
    }

    // Set UI to Connected State
    function setConnectedUI(deviceName) {
      connectState.style.display = "none";
      connectedState.style.display = "block";
      lidReadyView.style.display = "block";
      lidOpenView.style.display = "none";

      bleStatusIcon.classList.add("connected");
      connectionPill.className = "connection-pill pill-connected";
      connectionPillText.textContent = `Connected: ${deviceName}`;
    }

    // Set UI to Disconnected State
    function setDisconnectedUI(reason = "Disconnected") {
      connectedState.style.display = "none";
      connectState.style.display = "block";

      bleStatusIcon.classList.remove("connected");
      connectionPill.className = "connection-pill pill-disconnected";
      connectionPillText.textContent = reason;

      if (countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
      }
    }

    // Handle Hardware Disconnect Event
    function onDisconnected(event) {
      const device = event.target;
      showUserStatus("Disconnected");
      bluetoothDevice = null;
      gattServer = null;
      lidCharacteristic = null;
      setDisconnectedUI("Disconnected");
    }

    // Connect via Web Bluetooth API
    async function requestBleConnection() {
      if (!navigator.bluetooth) {

        alert("Web Bluetooth API is not available on this browser. Please use Chrome/Edge or click 'Test Mode: Simulate BLE Connection'.");
        return;
      }

      try {
        showUserStatus("Searching for SmartBin-1...");
        connectionPillText.textContent = "Requesting device...";

        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [
            { name: BLE_CONFIG.deviceName },
            { services: [BLE_CONFIG.serviceUuid] }
          ],
          optionalServices: [BLE_CONFIG.serviceUuid]
        });
        showUserStatus("Connecting to SmartBin-1...");
        bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

        gattServer = await bluetoothDevice.gatt.connect();
        showUserStatus("Connected to SmartBin-1", "success");
        const service = await gattServer.getPrimaryService(BLE_CONFIG.serviceUuid);
        try {
          lidCharacteristic = await service.getCharacteristic(BLE_CONFIG.charLidUuid);
        } catch (charErr) {
        }

        isSimulated = false;
        setConnectedUI(bluetoothDevice.name || BLE_CONFIG.deviceName);

      } catch (err) {
        showUserStatus("Unable to connect. Please try again.", "error");
        setDisconnectedUI("Connection failed");
      }
    }

    // Trigger Lid Open Command
    async function triggerOpenLid() {

      try {
        if (!isSimulated && lidCharacteristic) {
          // Send 0x01 byte to characteristic to open lid
          const command = new Uint8Array([0x01]);
          await lidCharacteristic.writeValue(command);
        } else {
        }

        // Notify Database layer (Firebase or Mock)
        if (window.smartBinDB) {
          window.smartBinDB.updateBin("SmartBin-1", { lidStatus: "Open" });
        }

        // Display Opening / Countdown UI
        lidReadyView.style.display = "none";
        lidOpenView.style.display = "block";

        let secondsRemaining = 10;
        countdownSecs.textContent = secondsRemaining;

        countdownInterval = setInterval(() => {
          secondsRemaining--;
          countdownSecs.textContent = secondsRemaining;

          if (secondsRemaining <= 0) {
            clearInterval(countdownInterval);
            countdownInterval = null;
            showUserStatus("Connected to SmartBin-1", "success");
            // Send close command or update database
            if (window.smartBinDB) {
              const isBio = Math.random() > 0.5;
              window.smartBinDB.simulateDeposit("SmartBin-1", isBio);
              window.smartBinDB.updateBin("SmartBin-1", { lidStatus: "Closed" });
            }

            lidOpenView.style.display = "none";
            lidReadyView.style.display = "block";
          }
        }, 1000);

      } catch (err) {
        showUserStatus("Could not open the lid. Please try again.", "error");
      }
    }

    // Disconnect Action
    function disconnectDevice() {
      if (isSimulated) {

        isSimulated = false;
        setDisconnectedUI("Disconnected");
      } else if (bluetoothDevice && bluetoothDevice.gatt.connected) {
        bluetoothDevice.gatt.disconnect();
      } else {
        setDisconnectedUI("Disconnected");
      }
    }

    // Event Listeners
    connectBtn.addEventListener("click", requestBleConnection);
    openLidBtn.addEventListener("click", triggerOpenLid);
    disconnectBtn.addEventListener("click", disconnectDevice);

  </script>
</body>
</html>
